version: '3.8'

services:
  face-recognition:
    build: .
    container_name: face_recognition_app
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./dataset:/app/dataset
      - ./encodings.pickle:/app/encodings.pickle
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - FLASK_ENV=production
    depends_on:
      - ollama
    networks:
      - face_net
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama_llm
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - face_net
    restart: unless-stopped

volumes:
  ollama_data:

networks:
  face_net:
    driver: bridge
